name: Scheduled Daily Macro Sentiment Airflow Pipeline

on:
  push:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-airflow-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Airflow and Environment Tools
        run: |
          python -m pip install --upgrade pip
          # virtualenv is structurally required by the PythonVirtualenvOperator to function
          pip install virtualenv
          
          # Install Airflow core cleanly under standard core constraints
          pip install "apache-airflow==3.2.2" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.8.1/constraints-3.11.txt"

      - name: Initialize Ephemeral Airflow Database
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
        run: |
          airflow db init

      - name: Execute Airflow DAG Task Instance
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          airflow dags test realtime_macro_sentiment_pipeline $(date +'%Y-%m-%d')

      - name: Commit and Push Generated Artifacts
        run: |
          git config --local user.email "spakhale.sp@gmail.com"
          git config --local user.name "GitHub Action Bot"
          
          if [ -n "$(git status --porcelain digests/)" ]; then
            git add digests/
            git commit -m "chore: automated daily macro sentiment digest compilation [skip ci]"
            git push
          else
            echo "No new updates written to disk for today. Skipping commit."
          fi